name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Maven Checkstyle goal
        run: mvn checkstyle:check

      - name: test
        run: mvn test

  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
#    if: github.event_name == 'push'
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create values.properties
        run: |
          cat << EOF > src/main/resources/values.properties
          POSTGRES_URL=${{ secrets.POSTGRES_URL }}
          POSTGRES_USERNAME=${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TOKEN_EXPIRATION=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ENDPOINT=${{ secrets.AWS_ENDPOINT }}
          AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
          EOF

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload JAR on server
        run: |
          scp -o StrictHostKeyChecking=no target/*.jar ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_IP }}:${{ secrets.REMOTE_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            
            echo "Stopping and removing old container..."
            sudo docker stop cardCollection || true
            sudo docker rm cardCollection || true
            
            echo "Starting new container..."
            cd ${{ secrets.REMOTE_PATH }}
            sudo docker-compose up --build -d
            
            echo "Cleaning up old images..."
            sudo docker image prune -f
